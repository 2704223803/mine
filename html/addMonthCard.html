<!-- 增加月卡页面：通过 URL 参数 id 复用新增和编辑两种模式。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>增加月卡 - 月卡后台管理系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- 整体后台布局：左侧导航 + 右侧主内容 -->
  <div class="app">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">MC</span>
        <span class="brand-text">月卡后台管理</span>
      </div>
      <nav class="menu">
        <a class="menu-link" data-page="index.html" href="index.html">
          <span class="menu-label">工作台首页</span>
        </a>
        <button class="menu-parent" type="button">
          <span class="menu-label">月卡管理</span>
          <span class="arrow">▾</span>
        </button>
        <div class="submenu">
          <a data-page="monthCard.html" href="monthCard.html">月卡列表</a>
          <a data-page="addMonthCard.html" href="addMonthCard.html">增加月卡</a>
        </div>
      </nav>
    </aside>

    <!-- 右侧主内容区 -->
    <div class="main">
      <!-- 顶部公共头部 -->
      <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" type="button" title="折叠/展开菜单">≡</button>
        <div class="topbar-title" id="pageTopbarTitle">增加月卡</div>
        <div class="topbar-right">
          <span class="user-avatar">管</span>
          <span>管理员 / admin</span>
        </div>
      </header>

      <main class="content">
        <!-- 页面标题和返回按钮 -->
        <div class="page-head">
          <div>
            <h1 id="pageTitle">增加月卡</h1>
            <p id="pageSubtitle">填写车辆与缴费信息，保存后写入本地存储</p>
          </div>
          <button class="btn secondary" id="backBtn" type="button">← 返回列表</button>
        </div>

        <!-- 新增或编辑月卡表单 -->
        <form id="monthCardForm" novalidate>
          <!-- 车辆信息卡片 -->
          <section class="card">
            <div class="card-head">
              <h2>车辆信息</h2>
            </div>
            <div class="card-body">
              <div class="form-grid">
                <!-- 车主姓名 -->
                <div class="form-item">
                  <label>车主姓名<span class="required">*</span></label>
                  <input class="input" id="ownerName" type="text" placeholder="请输入车主姓名">
                  <span class="field-error" data-error-for="ownerName"></span>
                </div>
                <!-- 手机号 -->
                <div class="form-item">
                  <label>手机号<span class="required">*</span></label>
                  <input class="input" id="phone" type="text" maxlength="11" placeholder="请输入 11 位手机号">
                  <span class="field-error" data-error-for="phone"></span>
                </div>
                <!-- 车牌号 -->
                <div class="form-item">
                  <label>车牌号<span class="required">*</span></label>
                  <input class="input" id="plateNo" type="text" placeholder="例如：京A12345">
                  <span class="field-error" data-error-for="plateNo"></span>
                </div>
                <!-- 车型 -->
                <div class="form-item">
                  <label>车型<span class="required">*</span></label>
                  <input class="input" id="carType" type="text" placeholder="例如：轿车 / SUV">
                  <span class="field-error" data-error-for="carType"></span>
                </div>
                <!-- 颜色 -->
                <div class="form-item">
                  <label>颜色<span class="required">*</span></label>
                  <input class="input" id="carColor" type="text" placeholder="例如：白色">
                  <span class="field-error" data-error-for="carColor"></span>
                </div>
                <!-- 车位号 -->
                <div class="form-item">
                  <label>车位号<span class="required">*</span></label>
                  <input class="input" id="parkingSpace" type="text" placeholder="例如：A001">
                  <span class="field-error" data-error-for="parkingSpace"></span>
                </div>
              </div>
            </div>
          </section>

          <!-- 缴费信息卡片 -->
          <section class="card">
            <div class="card-head">
              <h2>缴费信息</h2>
            </div>
            <div class="card-body">
              <div class="form-grid">
                <!-- 办理月数 -->
                <div class="form-item">
                  <label>办理月数<span class="required">*</span></label>
                  <input class="input" id="monthCount" type="number" min="1" placeholder="请输入办理月数">
                  <span class="field-error" data-error-for="monthCount"></span>
                </div>
                <!-- 缴费金额 -->
                <div class="form-item">
                  <label>缴费金额<span class="required">*</span></label>
                  <input class="input" id="amount" type="number" min="0" step="0.01" placeholder="请输入缴费金额">
                  <span class="field-error" data-error-for="amount"></span>
                </div>
                <!-- 缴费方式 -->
                <div class="form-item">
                  <label>缴费方式<span class="required">*</span></label>
                  <select class="select" id="payMethod">
                    <option value="">请选择</option>
                    <option value="现金">现金</option>
                    <option value="微信">微信</option>
                    <option value="支付宝">支付宝</option>
                    <option value="银行卡">银行卡</option>
                  </select>
                  <span class="field-error" data-error-for="payMethod"></span>
                </div>
                <!-- 开始日期 -->
                <div class="form-item">
                  <label>开始日期<span class="required">*</span></label>
                  <input class="input" id="startDate" type="date">
                  <span class="field-error" data-error-for="startDate"></span>
                </div>
                <!-- 结束日期 -->
                <div class="form-item">
                  <label>结束日期<span class="required">*</span></label>
                  <input class="input" id="endDate" type="date">
                  <span class="field-error" data-error-for="endDate"></span>
                </div>
              </div>

              <!-- 剩余天数和状态预览 -->
              <div class="preview-strip">
                <div>
                  <span>剩余有效天数</span>
                  <strong id="remainDayPreview">--</strong>
                </div>
                <div>
                  <span>自动判断状态</span>
                  <strong id="statusPreview">--</strong>
                </div>
              </div>
            </div>
          </section>

          <!-- 表单操作按钮 -->
          <div class="form-actions">
            <button class="btn secondary" id="resetBtn" type="button">重置</button>
            <button class="btn" id="saveBtn" type="button">保存</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/addMonthCard.js"></script>
</body>
</html>
